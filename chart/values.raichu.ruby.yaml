serviceTree:
  landscape: &landscape raichu
  cluster: &cluster ruby

tags: &tags
  atomi.cloud/landscape: *landscape
  atomi.cloud/cluster: *cluster

kyverno:
  backgroundController:
    podAnnotations:
      <<: *tags
    podLabels:
      <<: *tags
  admissionController:
    podLabels:
      <<: *tags
    podAnnotations:
      <<: *tags
    # The chart default (250m limit) throttles the admission controller on the
    # busy raichu cluster until its 5s liveness probe times out; it then
    # crash-loops, and because the webhook fails closed no pod can be created
    # cluster-wide (2026-10-10: tin could not start any helium-pollee jobs).
    container:
      resources:
        limits:
          memory: 512Mi
          cpu: 1
        requests:
          cpu: 250m
          memory: 256Mi
  cleanupController:
    podAnnotations:
      <<: *tags
    podLabels:
      <<: *tags
  reportsController:
    podLabels:
      <<: *tags
    podAnnotations:
      <<: *tags

# -- Kyverno Policy Reporter Configuration. See [Policy Reporter](https://github.com/kyverno/policy-reporter)
policy-reporter:
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  podLabels:
    <<: *tags
  podAnnotations:
    <<: *tags
  ui:
    resources:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 128Mi
    podLabels:
      <<: *tags
    podAnnotations:
      <<: *tags
